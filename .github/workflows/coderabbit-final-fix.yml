name: Apply final CodeRabbit minor fix

on:
  push:
    branches:
      - coderabbit-review-current-main
    paths:
      - .github/workflows/coderabbit-final-fix.yml

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - name: Check out branch
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: coderabbit-review-current-main
      - name: Apply fix
        run: python coderabbit_final_fix.py
      - name: Validate targets
        shell: bash
        run: |
          set -euo pipefail
          ! grep -F '(a[i].txt ? "<q>" + esc(a[i].txt) + "</q> &#8212; " : "") + (a[i].say ? a[i].say : esc(a[i].txt || ""))' dsem.html power.html multilevel.html
          grep -F '(a[i].say && a[i].txt ? "<q>" + esc(a[i].txt) + "</q> &#8212; " : "") + (a[i].say ? a[i].say : esc(a[i].txt || ""))' dsem.html power.html multilevel.html
      - name: Commit fix and remove temporary automation
        shell: bash
        run: |
          set -euo pipefail
          rm -f coderabbit_final_fix.py .github/workflows/coderabbit-final-fix.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "fix: avoid duplicated warning text"
          git push origin HEAD:coderabbit-review-current-main
