name: Replace site with final build

on:
  issue_comment:
    types: [created]

permissions:
  contents: write
  issues: read
  pull-requests: read

jobs:
  replace:
    if: github.event.comment.body == 'DEPLOY_SEMSTUDIO_NEW_BUILD'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Reconstruct and verify reviewed build
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
        run: |
          python - <<'PY'
          import base64, json, os, re, urllib.request, hashlib
          repo, issue, token = os.environ['REPOSITORY'], os.environ['ISSUE_NUMBER'], os.environ['GH_TOKEN']
          chunks, expected, page = {}, None, 1
          pat = re.compile(r'(?m)^SEMSTUDIO_PAYLOAD4_(\d{3})_(\d{3})\n(.*?)(?=^SEMSTUDIO_PAYLOAD4_\d{3}_\d{3}\n|\Z)', re.S|re.M)
          while True:
              req = urllib.request.Request(f'https://api.github.com/repos/{repo}/issues/{issue}/comments?per_page=100&page={page}', headers={'Authorization':f'Bearer {token}','Accept':'application/vnd.github+json'})
              with urllib.request.urlopen(req) as r: rows = json.load(r)
              if not rows: break
              for row in rows:
                  for m in pat.finditer(row.get('body') or ''):
                      i, total, data = int(m.group(1)), int(m.group(2)), m.group(3).strip()
                      expected = total if expected is None else expected
                      if total != expected: raise SystemExit('Payload chunk counts disagree')
                      chunks[i] = data
              page += 1
          if expected is None or len(chunks) != expected or set(chunks) != set(range(1, expected+1)):
              raise SystemExit(f'Incomplete payload: found {len(chunks)}, expected {expected}')
          archive = base64.b85decode(''.join(chunks[i] for i in range(1, expected+1)).encode('ascii'))
          digest = hashlib.sha256(archive).hexdigest()
          if digest != '8787048a0f7b6faeaa5cc6553b904aff3a25232af9050fe3f70a3e678e198635': raise SystemExit(f'Wrong SHA-256: {digest}')
          open('/tmp/semstudio-final.tar.xz','wb').write(archive)
          print(f'Verified {len(archive)} bytes; SHA-256 {digest}')
          PY
      - name: Replace repository tree and commit
        run: |
          find . -mindepth 1 -maxdepth 1 ! -name .git -exec rm -rf {} +
          tar -xJf /tmp/semstudio-final.tar.xz -C .
          test "$(find . -type f | wc -l)" -eq 27
          test "$(find . -maxdepth 1 -type f -name '*.html' | wc -l)" -eq 22
          grep -q 'INFORMATION = OBSERVED' missing.html
          ! grep -q 'Omega, alpha and the average variance extracted are computed from the unstandardized solution' reliability.html
          git config user.name 'semstudio deployment'
          git config user.email 'actions@users.noreply.github.com'
          git add -A
          git commit -m 'Replace site with final reviewed build'
          git push origin HEAD:main
